<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TreasureChestNo</title>
<meta name="description" content="A new way to say no, every day.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TreasureChestNo">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Kalam:wght@400;700&family=Permanent+Marker&display=swap">
<script>
  try { if (localStorage.getItem("layout") === "treasure") document.documentElement.dataset.layout = "treasure"; } catch (e) {}
</script>
<style>
  :root {
    --ground: #EEF1F4;
    --paper: #FFFFFF;
    --ink: #141B24;
    --muted: #5B6673;
    --line: #D5DBE2;
    --stop: #C8102E;
    --stop-soft: #FBE7EA;
    --shadow: 0 1px 0 rgba(20,27,36,.04), 0 12px 32px -12px rgba(20,27,36,.18);
    --display: "Bricolage Grotesque", "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0E1318;
      --paper: #171E26;
      --ink: #EDF1F5;
      --muted: #93A0AE;
      --line: #2A333E;
      --stop: #FF5A6E;
      --stop-soft: #3A1C22;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0E1318;
    --paper: #171E26;
    --ink: #EDF1F5;
    --muted: #93A0AE;
    --line: #2A333E;
    --stop: #FF5A6E;
    --stop-soft: #3A1C22;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 32px -12px rgba(0,0,0,.6);
  }

  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    -webkit-text-size-adjust: 100%;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--display);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
    padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  }
  .app {
    max-width: 440px;
    margin: 0 auto;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 800;
    font-size: clamp(17px, 5vw, 20px);
    white-space: nowrap;
    letter-spacing: -0.01em;
    min-width: 0;
  }
  .brand span { overflow: hidden; text-overflow: ellipsis; }
  .logo {
    width: 30px; height: 30px;
    border-radius: 7px;
    flex: none;
    object-fit: cover;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-btn {
    width: 38px;
    min-height: 38px;
    height: 38px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 10px;
    color: var(--muted);
  }
  .icon-btn svg { width: 20px; height: 20px; }

  .settings {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
  }
  .settings fieldset { border: 0; margin: 0; padding: 0; }
  .settings legend {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    padding: 0;
    margin-bottom: 10px;
  }
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .segmented label {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 44px;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
  }
  .segmented input {
    position: absolute;
    opacity: 0;
    inset: 0;
    margin: 0;
    cursor: pointer;
  }
  .segmented label:has(input:checked) {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .segmented label:has(input:focus-visible) { outline: 3px solid var(--stop); outline-offset: 2px; }
  .streak {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* Tear-off calendar page */
  .page {
    background: var(--paper);
    border-radius: 6px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .page-top {
    background: var(--stop);
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 12px 18px 10px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .perf {
    height: 10px;
    background:
      radial-gradient(circle at 5px 0, var(--ground) 3px, transparent 3.5px) 0 0 / 14px 10px repeat-x;
  }
  .page-body {
    padding: 10px 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 330px;
  }
  .dayrow {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .daynum {
    font-size: 64px;
    font-weight: 800;
    line-height: .9;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
  }
  .weekday {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    text-align: right;
    line-height: 1.5;
  }
  .rule { height: 1px; background: var(--line); }
  .kicker {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }
  .phrase {
    margin: 0;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
    flex: 1;
    display: flex;
    align-items: center;
    font-size: var(--phrase-size, 44px);
    transition: opacity .25s ease, transform .25s ease;
    white-space: pre-line;
  }
  .phrase.swap { opacity: 0; transform: translateY(6px); }
  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .tone {
    font-family: var(--mono);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--stop-soft);
    color: var(--stop);
    letter-spacing: .04em;
  }
  .use {
    font-size: 14px;
    color: var(--muted);
    margin: 0;
    line-height: 1.45;
  }

  .actions {
    display: grid;
    grid-template-columns: 52px 1fr 52px;
    gap: 10px;
  }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    min-height: 52px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button:focus-visible { outline: 3px solid var(--stop); outline-offset: 2px; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .35; cursor: default; transform: none; }
  .primary {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    font-weight: 600;
    font-size: 17px;
  }
  .arrow { font-size: 22px; font-weight: 600; }
  .today-link {
    background: none;
    border: 0;
    min-height: 32px;
    color: var(--stop);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .06em;
    text-transform: uppercase;
    justify-self: center;
  }

  details {
    border-top: 1px solid var(--line);
    padding-top: 8px;
  }
  summary {
    cursor: pointer;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 0;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: " +"; }
  details[open] summary::after { content: " –"; }
  .all {
    list-style: none;
    margin: 4px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
  }
  .all li {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 12px;
    align-items: baseline;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 16px;
    line-height: 1.3;
  }
  .all li.current { color: var(--stop); font-weight: 600; }
  .all .t {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    white-space: nowrap;
  }
  .all li > span:first-child { white-space: pre-line; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) {
    .phrase, .toast { transition: none; }
  }

  /* Treasure chest layout, themed on the Team Treasure Chest board
     (team-treasure-chest.jpg): sand, parchment, wood and gold. */
  .value, .banner { display: none; }
  :root[data-layout="treasure"] {
    color-scheme: light;
    --ground: #EEDCB3;
    --paper: #F8EBCB;
    --ink: #1B3A5C;
    --muted: #6B5A3E;
    --line: #D2B77F;
    --stop: #1E7A8C;
    --stop-soft: #F2C24B;
    --card-ink: #1B3A5C;
    --card-muted: #6B5A3E;
    --wood: #6A3F1D;
    --wood-dark: #4A2A12;
    --gold: #F2C24B;
    --gold-dark: #C8901E;
    --shadow: 0 1px 0 rgba(74,42,18,.08), 0 14px 30px -12px rgba(74,42,18,.45);
    --hand: "Kalam", "Chalkboard SE", "Comic Sans MS", cursive;
    --marker: "Permanent Marker", "Chalkboard SE", "Marker Felt", cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root[data-layout="treasure"]:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0E2230;
      --paper: #EEDDB4;
      --ink: #F3E6C6;
      --muted: #B8A57E;
      --line: #2C4556;
      --stop: #F2C24B;
      --shadow: 0 1px 0 rgba(0,0,0,.3), 0 16px 34px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-layout="treasure"][data-theme="dark"] {
    color-scheme: dark;
    --ground: #0E2230;
    --paper: #EEDDB4;
    --ink: #F3E6C6;
    --muted: #B8A57E;
    --line: #2C4556;
    --stop: #F2C24B;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 16px 34px -12px rgba(0,0,0,.7);
  }
  [data-layout="treasure"] body {
    font-family: var(--hand);
    background:
      radial-gradient(rgba(106,63,29,.09) 1px, transparent 1.5px) 0 0 / 7px 7px,
      var(--ground);
  }
  [data-layout="treasure"] .brand {
    font-family: var(--marker);
    font-weight: 400;
    font-size: clamp(18px, 5.2vw, 21px);
    letter-spacing: .01em;
  }
  [data-layout="treasure"] .logo {
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--gold), 0 2px 6px rgba(74,42,18,.35);
  }
  [data-layout="treasure"] .streak { font-family: var(--hand); font-size: 14px; text-transform: none; letter-spacing: 0; }

  /* The page becomes a parchment scroll under a wooden plank. */
  [data-layout="treasure"] .page {
    color: var(--card-ink);
    border-radius: 4px 4px 14px 14px;
    background:
      radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(160,110,40,.22) 100%),
      var(--paper);
    border: 1px solid rgba(160,110,40,.35);
  }
  [data-layout="treasure"] .page-top {
    font-family: var(--marker);
    font-size: 15px;
    letter-spacing: .06em;
    padding: 12px 20px;
    color: var(--gold);
    background:
      radial-gradient(circle at 10px 50%, var(--gold) 2.5px, transparent 3px),
      radial-gradient(circle at calc(100% - 10px) 50%, var(--gold) 2.5px, transparent 3px),
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 7px, rgba(0,0,0,.12) 7px 8px),
      linear-gradient(180deg, var(--wood), var(--wood-dark));
    text-shadow: 0 1px 0 rgba(0,0,0,.4);
  }
  [data-layout="treasure"] .perf { display: none; }
  [data-layout="treasure"] .page-body { padding-top: 16px; }
  [data-layout="treasure"] .daynum { font-family: var(--marker); font-weight: 400; letter-spacing: 0; color: var(--wood); }
  [data-layout="treasure"] .weekday,
  [data-layout="treasure"] .kicker,
  [data-layout="treasure"] .use { color: var(--card-muted); }
  [data-layout="treasure"] .weekday,
  [data-layout="treasure"] .kicker { font-family: var(--hand); font-size: 14px; letter-spacing: .04em; }
  [data-layout="treasure"] .rule {
    height: 3px;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, #2BA3B8 12%, #2BA3B8 88%, transparent);
    opacity: .7;
  }
  [data-layout="treasure"] .phrase {
    font-family: var(--hand);
    font-weight: 700;
    letter-spacing: 0;
    line-height: 1.15;
  }
  [data-layout="treasure"] .tone {
    font-family: var(--hand);
    font-weight: 700;
    font-size: 14px;
    color: var(--wood-dark);
    background: radial-gradient(circle at 35% 30%, #FBE08A, var(--gold) 60%);
    border: 1px solid var(--gold-dark);
    box-shadow: 0 1px 0 var(--gold-dark);
  }
  [data-layout="treasure"] .use { font-size: 16px; }
  [data-layout="treasure"] .value {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 2px;
    padding-top: 14px;
    border-top: 1px dashed rgba(160,110,40,.5);
    font-size: 16px;
    line-height: 1.3;
  }
  [data-layout="treasure"] .value-icon { font-size: 26px; line-height: 1; }
  [data-layout="treasure"] .value-kind { font-size: 13px; color: var(--card-muted); }

  /* Wooden buttons, and a gold coin for the main one. */
  [data-layout="treasure"] button {
    font-family: var(--hand);
  }
  [data-layout="treasure"] .arrow,
  [data-layout="treasure"] .icon-btn {
    color: var(--gold);
    border-color: var(--wood-dark);
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 9px, rgba(0,0,0,.1) 9px 10px),
      linear-gradient(180deg, var(--wood), var(--wood-dark));
  }
  [data-layout="treasure"] .primary {
    font-size: 19px;
    font-weight: 700;
    color: var(--wood-dark);
    border: 1px solid var(--gold-dark);
    background: linear-gradient(180deg, #FBE08A, var(--gold) 55%, #E0A526);
    box-shadow: inset 0 -2px 0 rgba(200,144,30,.6);
  }
  [data-layout="treasure"] .today-link { font-family: var(--hand); font-size: 15px; font-weight: 700; }
  [data-layout="treasure"] summary { font-family: var(--hand); font-size: 15px; letter-spacing: .02em; }
  [data-layout="treasure"] .all li { font-size: 17px; }
  [data-layout="treasure"] .all li.current { color: var(--stop); font-weight: 700; }
  [data-layout="treasure"] .all .t { font-family: var(--hand); font-size: 13px; }
  [data-layout="treasure"] .settings { color: var(--card-ink); }
  [data-layout="treasure"] .settings legend { color: var(--card-muted); font-family: var(--hand); font-size: 14px; }
  [data-layout="treasure"] .segmented label { border-color: #D2B77F; }
  [data-layout="treasure"] .segmented label:has(input:checked) {
    background: linear-gradient(180deg, #FBE08A, var(--gold));
    color: var(--wood-dark);
    border-color: var(--gold-dark);
  }
  [data-layout="treasure"] .toast { background: var(--wood-dark); color: #F8EBCB; font-family: var(--hand); }
  [data-layout="treasure"] .banner {
    display: block;
    text-align: center;
    font-family: var(--hand);
    font-weight: 700;
    font-size: 15px;
    color: #F8EBCB;
    padding: 12px 14px;
    border-radius: 8px;
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,0) 0 9px, rgba(0,0,0,.1) 9px 10px),
      linear-gradient(180deg, var(--wood), var(--wood-dark));
    box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><img class="logo" src="icons/icon-192.png" alt="" width="30" height="30"><span>TreasureChestNo</span></div>
    <div class="head-right">
      <div class="streak" id="count"></div>
      <button class="icon-btn" id="settings-btn" type="button" aria-label="Settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="settings" id="settings" hidden>
    <fieldset>
      <legend>Layout</legend>
      <div class="segmented">
        <label><input type="radio" name="layout" value="classic">Classic</label>
        <label><input type="radio" name="layout" value="treasure">Treasure chest</label>
      </div>
    </fieldset>
  </section>

  <article class="page" aria-live="polite">
    <div class="page-top"><span id="month"></span><span id="year"></span></div>
    <div class="perf" aria-hidden="true"></div>
    <div class="page-body">
      <div class="dayrow">
        <div class="daynum" id="daynum"></div>
        <div class="weekday" id="weekday"></div>
      </div>
      <div class="rule"></div>
      <div class="kicker" id="kicker">Today's no</div>
      <p class="phrase" id="phrase"></p>
      <div class="meta">
        <span class="tone" id="tone"></span>
      </div>
      <p class="use" id="use"></p>
      <div class="value">
        <span class="value-icon" id="value-icon" aria-hidden="true"></span>
        <div><div class="value-kind" id="value-kind"></div><div id="value-text"></div></div>
      </div>
    </div>
  </article>

  <div class="actions">
    <button class="arrow" id="prev" type="button" aria-label="Previous day">‹</button>
    <button class="primary" id="copy" type="button">Copy today's no</button>
    <button class="arrow" id="next" type="button" aria-label="Next day">›</button>
  </div>
  <button class="today-link" id="today" type="button" hidden>Back to today</button>

  <details>
    <summary id="all-label">All the ways to say no</summary>
    <ul class="all" id="all"></ul>
  </details>
  <div class="banner">Five people · One team · Endless potential</div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
  const NOS = [
    { text: "Not this time.", tone: "Polite", use: "Leaves the door open for next time without promising anything." },
    { text: "I'll pass.", tone: "Short", use: "Two words. No reason owed." },
    { text: "I'm afraid not.", tone: "Polite", use: "Sounds sorry. Isn't changing its mind." },
    { text: "No thank you.", tone: "Polite", use: "The classic. Works on waiters, salespeople and relatives." },
    { text: "I don't think so.", tone: "Firm", use: "Soft on the surface, a closed door underneath." },
    { text: "That's not something I can agree to.", tone: "Professional", use: "For contracts, scope creep and anything in writing." },
    { text: "That won't work for me.", tone: "Firm", use: "Makes it about your limits, so there's nothing to argue with." },
    { text: "I can't commit to that timeline responsibly.", tone: "Professional", use: "For the deadline that was set before anyone asked you." },
    { text: "I'm not the right person to join this meeting, but I'm happy to share input beforehand.", tone: "Professional", use: "Declines the invite, keeps the goodwill. Your calendar says thanks." },
    { text: "Nah.", tone: "Casual", use: "For friends, family and anyone who's earned the shorthand." },
    { text: "I can see how that's a problem. But I can't see how it's MY problem.", tone: "Cheeky", use: "Sympathy acknowledged. Responsibility returned to sender." },
    { text: "That's not the dumbest idea I've ever heard, but it's close.", tone: "Cheeky", use: "Only for people who'll laugh. Know your audience." },
    { text: "Would you like a short or a long answer?\nShort answer: no.\nLong answer: noooooo.", tone: "Cheeky", use: "Let them pick. Both roads lead to the same place." },
    { text: "If today was opposite day, I'd say 'yes'.", tone: "Cheeky", use: "Technically a yes. Just not on any day that exists." },
    { text: "Would you like me to say no now? Or would you prefer if I said no tomorrow, after I've thought about it?", tone: "Cheeky", use: "Offers a choice of timing. The answer is the same either way." },
    { text: "Yeah - NAH.", tone: "Casual", use: "The Kiwi classic. The yeah is only there to soften the nah." },
    { text: "I'll do that in my 25th hour today.", tone: "Cheeky", use: "Happy to help, as soon as the day grows an extra hour." },
    { text: "Maybe next time.", tone: "Polite", use: "Friendly, open-ended, and commits to nothing." },
    { text: "When you have worked out a way without me, let me know.", tone: "Cheeky", use: "Sounds supportive. Actually hands the whole thing back." },
    { text: "Rain check?", tone: "Casual", use: "A no dressed up as a maybe later." },
    { text: "That sounds like a great job for...", tone: "Cheeky", use: "Finish the sentence with anyone who isn't you." },
    { text: "My head says yes, my heart says no. On this one, I'm going with my heart.", tone: "Polite", use: "Makes it sound like a hard decision, even when it wasn't." },
    { text: "That's not a good fit for me.", tone: "Professional", use: "Clean, neutral and hard to argue with." },
    { text: "My schedule is already full.", tone: "Professional", use: "A fact, not an excuse. No follow-up needed." },
    { text: "I'm so bummed, as my plate is so full right now.", tone: "Casual", use: "Sounds disappointed. Plate stays exactly as full." },
    { text: "Wish I could, much hugs and good luck with it!", tone: "Polite", use: "A no wrapped in a hug. Very hard to be annoyed at." },
    { text: "I have a prior engagement with my peace of mind.", tone: "Cheeky", use: "The one appointment that never gets moved." },
    { text: "For fuck's sake. No!", tone: "Blunt", use: "For when every other no on this list has already been tried." },
    { text: "Love the idea, but I can't commit.", tone: "Polite", use: "Compliments the idea, declines the work." },
    { text: "Cheering for you from afar on this one.", tone: "Polite", use: "Full support, from a comfortable distance." }
  ];

  // Fixed shuffle so the list doesn't just run top to bottom, and
  // similar tones don't land on back-to-back days.
  const ORDER = [13,  22,  29,  16,  4,  14,  27,  11,  19,  3,  12,  21,  26,  24,  20,  9,  7,  25,  10,  28,  6,  8,  2,  23,  0,  15,  5,  18,  17,  1];
  const DAY_MS = 86400000;

  // The team's values and behaviours from the Team Treasure Chest board.
  // The treasure chest layout shows one a day alongside the no.
  const TREASURE = [
    { icon: "☀️", kind: "Value", text: "Feel joy" },
    { icon: "💬", kind: "Behaviour", text: "Give and take feedback with positive intent" },
    { icon: "⛰️", kind: "Value", text: "Be open to challenge" },
    { icon: "💚", kind: "Behaviour", text: "Accept change in the status quo" },
    { icon: "🔄", kind: "Value", text: "Embrace change" },
    { icon: "🐢", kind: "Behaviour", text: "Unwind and slow down" },
    { icon: "🌱", kind: "Value", text: "Sustain energy" },
    { icon: "😄", kind: "Behaviour", text: "Be silly. Belly laugh." },
    { icon: "🛡️", kind: "Value", text: "Accountability" },
    { icon: "📅", kind: "Behaviour", text: "Scheduled accountability check-ins" }
  ];
  const THEME_COLORS = {
    classic: { light: "#EEF1F4", dark: "#0E1318" },
    treasure: { light: "#EEDCB3", dark: "#0E2230" }
  };

  const el = id => document.getElementById(id);
  const todayKey = () => {
    const d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY_MS);
  };
  const noFor = key => NOS[ORDER[((key % ORDER.length) + ORDER.length) % ORDER.length]];

  let offset = 0;

  function render(animate) {
    const key = todayKey() + offset;
    const date = new Date(key * DAY_MS);
    const no = noFor(key);
    const opts = { timeZone: "UTC" };

    el("month").textContent = date.toLocaleDateString(undefined, { ...opts, month: "long" });
    el("year").textContent = date.toLocaleDateString(undefined, { ...opts, year: "numeric" });
    el("daynum").textContent = date.toLocaleDateString(undefined, { ...opts, day: "numeric" });
    el("weekday").innerHTML = date.toLocaleDateString(undefined, { ...opts, weekday: "long" }) +
      "<br>" + (offset === 0 ? "Today" : offset === -1 ? "Yesterday" : offset === 1 ? "Tomorrow" :
        (offset < 0 ? -offset + " days ago" : "In " + offset + " days"));
    const treasure = layout() === "treasure";
    el("kicker").textContent = offset === 0 ? (treasure ? "X marks today's no" : "Today's no") : offset < 0 ? "That day's no" : "Coming up";
    const gem = TREASURE[((key % TREASURE.length) + TREASURE.length) % TREASURE.length];
    el("value-icon").textContent = gem.icon;
    el("value-kind").textContent = (offset === 0 ? "Today's team " : "Team ") + gem.kind.toLowerCase();
    el("value-text").textContent = gem.text;
    el("copy").textContent = offset === 0 ? "Copy today's no" : "Copy this no";
    el("today").hidden = offset === 0;
    el("count").textContent = "No. " + (NOS.indexOf(no) + 1) + " of " + NOS.length;

    const phrase = el("phrase");
    const set = () => {
      phrase.textContent = no.text;
      const len = no.text.length;
      phrase.style.setProperty("--phrase-size", len < 16 ? "52px" : len < 30 ? "40px" : len < 50 ? "32px" : "26px");
      el("tone").textContent = no.tone;
      el("use").textContent = no.use;
      phrase.classList.remove("swap");
    };
    if (animate) { phrase.classList.add("swap"); setTimeout(set, 180); } else set();

    el("all-label").textContent = "All " + NOS.length + " ways to say no";
    const list = el("all");
    list.innerHTML = "";
    NOS.forEach(n => {
      const li = document.createElement("li");
      if (n === no) li.className = "current";
      const t = document.createElement("span");
      t.textContent = n.text;
      const tone = document.createElement("span");
      tone.className = "t";
      tone.textContent = n.tone;
      li.append(t, tone);
      list.append(li);
    });
  }

  const layout = () => document.documentElement.dataset.layout === "treasure" ? "treasure" : "classic";

  function applyLayout(name) {
    if (name === "treasure") document.documentElement.dataset.layout = "treasure";
    else delete document.documentElement.dataset.layout;
    document.querySelectorAll('input[name="layout"]').forEach(r => { r.checked = r.value === name; });
    const colors = THEME_COLORS[name];
    document.querySelectorAll('meta[name="theme-color"]').forEach(m => {
      m.content = m.media.includes("dark") ? colors.dark : colors.light;
    });
  }

  el("settings-btn").addEventListener("click", () => {
    const panel = el("settings");
    panel.hidden = !panel.hidden;
    el("settings-btn").setAttribute("aria-expanded", String(!panel.hidden));
  });
  document.querySelectorAll('input[name="layout"]').forEach(r => r.addEventListener("change", () => {
    applyLayout(r.value);
    try { localStorage.setItem("layout", r.value); } catch (e) {}
    render(false);
  }));

  let toastTimer;
  function toast(msg) {
    const t = el("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
  }

  el("prev").addEventListener("click", () => { offset--; render(true); });
  el("next").addEventListener("click", () => { offset++; render(true); });
  el("today").addEventListener("click", () => { offset = 0; render(true); });
  el("copy").addEventListener("click", () => {
    const text = noFor(todayKey() + offset).text;
    navigator.clipboard.writeText(text).then(
      () => toast("Copied. Go say no."),
      () => {
        const range = document.createRange();
        range.selectNodeContents(el("phrase"));
        const sel = getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        toast("Selected. Tap Copy to finish.");
      }
    );
  });

  // Swipe left/right on the page to change day.
  let startX = null;
  const page = document.querySelector(".page");
  page.addEventListener("touchstart", e => { startX = e.touches[0].clientX; }, { passive: true });
  page.addEventListener("touchend", e => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    startX = null;
    if (Math.abs(dx) > 50) { offset += dx < 0 ? 1 : -1; render(true); }
  });

  // Roll over at midnight if the app is left open.
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) render(false);
  });

  applyLayout(layout());
  render(false);

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
</script>
</body>
</html>
